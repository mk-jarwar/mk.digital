<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting to MK Digital...</title>
    <script>
      var path = window.location.pathname;
      if (window.location.hostname.endsWith('github.io') && !path.includes('/docs')) {
        var base = path.split('/')[1] ? '/' + path.split('/')[1] : '';
        window.location.replace(base + '/docs/' + window.location.search + window.location.hash);
      } else {
        window.location.replace('./');
      }
    </script>
  </head>
  <body style="background:#0A0A0A;color:#fff;font-family:sans-serif;text-align:center;padding:50px;">
    <h2>Loading MK Digital...</h2>
    <p>If you are not redirected automatically, <a href="./docs/" style="color:#3b82f6;">click here</a>.</p>
  </body>
</html>
